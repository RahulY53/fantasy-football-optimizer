services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      FPL_OPTIMIZER_DATABASE_URL: sqlite:////app/data/fpl_optimizer.db
      FPL_OPTIMIZER_CACHE_DIR: /app/data/cache
    volumes:
      - fpl-data:/app/data
    restart: unless-stopped

  api:
    build: .
    profiles: ["api"]
    command: ["uvicorn", "api.main:app", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "8000:8000"
    environment:
      FPL_OPTIMIZER_DATABASE_URL: sqlite:////app/data/fpl_optimizer.db
      FPL_OPTIMIZER_CACHE_DIR: /app/data/cache
    volumes:
      - fpl-data:/app/data
    restart: unless-stopped

volumes:
  fpl-data:

